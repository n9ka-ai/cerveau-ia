name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Scripts du cerveau
        shell: bash
        run: bash tests/tout.sh
      - name: Le bash d'origine de macOS (3.2)
        if: runner.os == 'macOS'
        run: /bin/bash tests/tout.sh
